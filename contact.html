<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/contact.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="og">

    <div class="og2">
        <div class="content">
      <i class="fa-brands fa-facebook-messenger"></i>
      <span>Get in Touch</span>
    </div>
    <div class="contact">
      <span>Contact Us</span>
    </div>
    <div class="pg">
      <span>We're Here to Help to Find the Dress</span>
    </div>
    <div class="wel">
      <div class="alloc">
        <span class="location"><i class="fa-solid fa-location-dot"></i></span>
        <div class="loc">
          <span>Office Location</span><br />
          <p>Francis Road, 673003</p>
        </div>
      </div>
    </div>
    <div class="kol">
      <div class="alloc">
        <span class="location"><i class="fa-solid fa-phone"></i></span>
        <div class="loc">
          <span>Phone</span><br />
          <p>789673003</p>
        </div>
      </div>
    </div>
    <div class="kol">
      <div class="alloc">
        <span class="location"><i class="fa-regular fa-envelope"></i></i></span>
        <div class="loc">
          <span>Email</span><br />
          <p>hello@gmail.com</p>
        </div>
      </div>
    </div>
    </div>
    <div class="themain">
        <div class="name">
            <span>Full Name</span><br>
            <input type="text" placeholder="Your Name" class="box">
        </div>
        <div class="phn">
            <span>Phone Number</span><br>
            <input type="tel" placeholder="Your Phone Number" class="box">
        </div>
        <div class="text">
            <span>Inquiry type</span><br>
            <input type="text" placeholder="Buying Dresses" class="box">
        </div>
        <div class="msg">
            <span>Messege(Optional)</span><br>
            <input type="text" placeholder="Tell us more About our Product">
        </div>
        <button class="but">Submit</button><br>
        <div class="sent">
            <span>By Submitting this form, I agree to the <b>privacy policy</b> </span>
        </div>

    </div>
    </div>
  </body>
</html>
